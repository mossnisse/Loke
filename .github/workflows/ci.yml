# The whole gate, test-all.ps1 -Full -RequireTools, on Windows x64. The runner image
# already has LLVM, MSVC, and the Windows SDK where lokec looks for them; Odin
# and nasm are installed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the same gate on the tagged revision.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # readme.md "Build and run" names the Odin the tree builds with; the
      # dev-2026-10 release is that nightly's commit, 84bc3fc.
      - name: Install Odin dev-2026-10
        run: |
          $zip = "$env:RUNNER_TEMP\odin.zip"
          Invoke-WebRequest https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-windows-amd64-dev-2026-10.zip -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\odin"
          $odin = Get-ChildItem "$env:RUNNER_TEMP\odin" -Recurse -Filter odin.exe | Select-Object -First 1
          $odin.DirectoryName >> $env:GITHUB_PATH
          & $odin.FullName version

      # The installer does not reach this job's PATH; LOKE_NASM names it instead.
      - name: Install nasm
        run: |
          choco install nasm --no-progress -y
          $nasm = (Get-Item 'C:\Program Files\NASM\nasm.exe').FullName
          "LOKE_NASM=$nasm" >> $env:GITHUB_ENV
          & $nasm -v

      - name: Test
        run: .\test-all.ps1 -Full -RequireTools

      # Figures, not a gate: only a wrong benchmark output fails here. They are
      # compared with the latest release's record, when it has one, and a
      # release attaches this run's record (release.yml).
      - name: Performance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo $env:GITHUB_REPOSITORY --pattern perf.json --output baseline.json 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host 'No released perf.json to compare with'; $global:LASTEXITCODE = 0 }
          $baseline = if (Test-Path baseline.json) { 'baseline.json' }
          .\perf.ps1 -Out perf.json -Baseline $baseline

      - uses: actions/upload-artifact@v4
        with:
          name: perf
          path: perf.json
